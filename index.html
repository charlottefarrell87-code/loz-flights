const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function deriveRaw(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: b64(P.salt), iterations: P.iter, hash: 'SHA-256' }, base, 256));
}
async function open(raw) {
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, key, b64(P.ct)));
  document.open(); document.write(html); document.close();
}
(async () => {
  try {
    const saved = localStorage.getItem('loz-key');
    if (saved) { const s = JSON.parse(saved); if (s.salt === P.salt) await open(b64(s.k)); }
  } catch (e) { try { localStorage.removeItem('loz-key'); } catch (_) {} }
})();
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('err'); err.textContent = 'Unlocking…';
  try {
    const raw = await deriveRaw(document.getElementById('pw').value);
    if (document.getElementById('remember').checked) {
      try { localStorage.setItem('loz-key', JSON.stringify({ salt: P.salt, k: btoa(String.fromCharCode(...raw)) })); } catch (_) {}
    }
    await open(raw);
  } catch (x) { err.textContent = 'That password didn’t work. Try again.'; }
});

const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function deriveRaw(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: b64(P.salt), iterations: P.iter, hash: 'SHA-256' }, base, 256));
}
const toB64 = (u8) => { let s = ''; for (let i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]); return btoa(s); };
async function unlock(raw) {
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, key, b64(P.ct)));

  try { sessionStorage.setItem('loz-k', toB64(raw)); } catch (_) {}
  mount(html);
}
// Swap this sign-in page for the unlocked page without document.write, which some
// browsers merge into the current page instead of replacing it.
function mount(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const fresh = (old) => { const n = document.createElement('script'); for (const a of old.attributes) n.setAttribute(a.name, a.value); n.textContent = old.textContent; return n; };
  const head = document.adoptNode(doc.head), body = document.adoptNode(doc.body);
  for (const sc of [...head.querySelectorAll('script'), ...body.querySelectorAll('script')]) sc.replaceWith(fresh(sc));
  if (doc.documentElement.lang) document.documentElement.lang = doc.documentElement.lang;
  document.documentElement.removeAttribute('style');
  document.head.replaceWith(head);
  document.body.replaceWith(body);
  window.scrollTo(0, 0);
}

          try { localStorage.setItem('loz-key', JSON.stringify({ salt: P.salt, k: toB64(raw) })); } catch (_) {}
          await unlock(raw);
        }
      }
    } catch (_) {}
    return;
  }
  try { const s = JSON.parse(saved); await unlock(b64(s.k)); }
  catch (e) {
    try { localStorage.removeItem('loz-key'); } catch (_) {}
    document.getElementById('err').textContent = 'Your saved password is out of date. Enter it again and tick Remember.';
    document.getElementById('remember').checked = true;
  }
})();
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('err'); err.textContent = 'Unlocking…';
  try {
    const raw = await deriveRaw(document.getElementById('pw').value);
    const remember = document.getElementById('remember').checked;
    // Check the password works before remembering it.
    const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, key, b64(P.ct));
    let stored = false;
    if (remember) { try { localStorage.setItem('loz-key', JSON.stringify({ salt: P.salt, k: toB64(raw) })); stored = localStorage.getItem('loz-key') !== null; } catch (_) {} }
    if (remember && window.PasswordCredential && navigator.credentials) {
      try { await navigator.credentials.store(new PasswordCredential({ id: 'loz-flights', password: document.getElementById('pw').value, name: 'Loz Flights' })); } catch (_) {}
    }
    if (remember && !stored) { err.textContent = 'This browser won’t let the page remember you (private browsing or blocked site data). Opening anyway…'; await new Promise((r) => setTimeout(r, 1500)); }
    await unlock(raw);
  } catch (x) { err.textContent = 'That password didn’t work. Try again.'; }
});

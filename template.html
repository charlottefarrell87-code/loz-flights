<title>Loz Flights</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  /* Layout: airport wayfinding. A sticky board of saved searches on top, one search's dashboard below; editor slides in as a panel. */
  :root {
    --bg: #f3f5f8; --panel: #ffffff; --fg: #142132; --muted: #5b6878; --line: #dde2ea;
    --sign: #f2b705; --sign-ink: #1a1400; --navy: #1e3d6e; --navy-ink: #ffffff;
    --good: #1f7a4d; --bad: #b42318; --bar: #c9d1dc; --uk: #3a6fb0; --chip: #e8edf4;
    --display: "Archivo", "Arial Narrow", system-ui, sans-serif;
    --body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    --r: 10px;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #0e141c; --panel: #161f2b; --fg: #e5ebf3; --muted: #93a1b3; --line: #273445;
    --sign: #f5c542; --sign-ink: #1a1400; --navy: #8fb4ec; --navy-ink: #0e141c;
    --good: #5cc48d; --bad: #f08b80; --bar: #3a4a5e; --uk: #7fb0ef; --chip: #1f2b3a; color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg: #0e141c; --panel: #161f2b; --fg: #e5ebf3; --muted: #93a1b3; --line: #273445;
    --sign: #f5c542; --sign-ink: #1a1400; --navy: #8fb4ec; --navy-ink: #0e141c;
    --good: #5cc48d; --bad: #f08b80; --bar: #3a4a5e; --uk: #7fb0ef; --chip: #1f2b3a; color-scheme: dark; }

  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--body); }
  .wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 56px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
  .wrap > *, #main, #main > * { min-width: 0; }
  h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; }
  h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.01em; }
  h2 { font-size: 22px; font-weight: 700; }
  h3 { font-size: 15px; font-weight: 700; letter-spacing: 0.01em; }
  p { margin: 0; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  a { color: var(--navy); }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--sign); outline-offset: 2px; }

  .top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .board { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
  .tab { flex: none; display: grid; gap: 2px; text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: var(--r); padding: 10px 14px; cursor: pointer; min-width: 180px; }
  .tab[aria-current="true"] { border-color: var(--fg); box-shadow: inset 0 -3px 0 var(--sign); }
  .tab .route { font-family: var(--mono); font-weight: 600; font-size: 13px; letter-spacing: 0.04em; }
  .tab .nm { font-weight: 600; }
  .tab .st { font-size: 12px; color: var(--muted); }
  .btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 600; }
  .btn.primary { background: var(--navy); color: var(--navy-ink); border-color: var(--navy); }
  .btn.sign { background: var(--sign); color: var(--sign-ink); border-color: var(--sign); }
  .btn.danger { color: var(--bad); }
  .btn.solid-danger { background: var(--bad); border-color: var(--bad); color: #fff; }
  .btn:disabled { opacity: .5; cursor: default; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; min-width: 0; }
  .head { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; justify-content: space-between; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { background: var(--chip); border-radius: 999px; padding: 3px 10px; font-size: 13px; }
  .chip b { font-weight: 600; }
  .pill { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; padding: 2px 8px; border-radius: 4px; background: var(--chip); color: var(--muted); vertical-align: middle; }
  .pill.live { background: var(--sign); color: var(--sign-ink); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .confirm { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; background: var(--chip); border-radius: 8px; padding: 8px 12px; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 12rem), 1fr)); gap: 12px; }
  .tile .lab { font-size: 13px; color: var(--muted); }
  .tile .big { font-family: var(--mono); font-weight: 600; font-size: 30px; line-height: 1.15; margin: 6px 0 4px; font-variant-numeric: tabular-nums; }
  .up { color: var(--bad); } .down { color: var(--good); }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 24rem), 1fr)); gap: 12px; }
  .chart { position: relative; margin-top: 14px; min-height: 120px; }
  .chart svg text { font-family: var(--body); font-size: 12px; fill: var(--muted); }
  .tip { position: absolute; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 18px rgba(0,0,0,.14); padding: 6px 10px; font-size: 13px; pointer-events: none; white-space: nowrap; }
  .tip span { display: block; color: var(--muted); }

  .tw { overflow-x: auto; margin-top: 12px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
  th { font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
  td.num, th.num { text-align: right; }
  td.code { font-family: var(--mono); font-weight: 600; }
  tr.best td { background: color-mix(in srgb, var(--good) 10%, transparent); }
  tr.best td.price { color: var(--good); font-weight: 700; }
  .plus { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-left: 2px; vertical-align: super; }
  a.book { display: inline-block; background: var(--navy); color: var(--navy-ink); text-decoration: none; border-radius: 6px; padding: 4px 10px; font-size: 13px; font-weight: 600; }
  a.cmp { font-size: 12px; color: var(--muted); margin-left: 8px; }

  .empty { text-align: center; padding: 40px 20px; display: grid; gap: 10px; justify-items: center; }
  .notice { border-left: 4px solid var(--sign); background: var(--panel); border-radius: 0 var(--r) var(--r) 0; padding: 12px 16px; }

  form.editor { display: grid; gap: 18px; }
  fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 12px; }
  legend { font-family: var(--display); font-weight: 700; font-size: 16px; margin-bottom: 8px; padding: 0; }
  .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 14rem), 1fr)); gap: 12px; }
  label.f { display: grid; gap: 4px; font-size: 13px; font-weight: 600; }
  label.f .hint { font-weight: 400; color: var(--muted); }
  input[type=text], input[type=date], input[type=number], select, textarea { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0; }
  textarea { min-height: 70px; resize: vertical; }
  .checks { display: flex; flex-wrap: wrap; gap: 8px 16px; }
  .checks label { display: flex; gap: 6px; align-items: center; font-size: 14px; }
  .formbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 14px; }
  .err { color: var(--bad); font-size: 13px; }
  @media (prefers-reduced-motion: no-preference) { .tab, .btn { transition: border-color .15s, background .15s; } }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Loz Flights</h1>
      <p class="muted small">Saved fare searches, checked on Google Flights every Tuesday and Friday morning.</p>
    </div>
    <div class="actions">
      <button class="btn" id="ghBtn" type="button" hidden>Connect GitHub to edit</button>
      <button class="btn" id="checkAllBtn" type="button" hidden>Check prices now</button>
      <button class="btn sign" id="newBtn" type="button" hidden>New search</button>
    </div>
  </header>

  <nav class="board" id="board" aria-label="Saved searches"></nav>

  <main id="main">
    <section class="card empty" id="loading">
      <h2>Loading your searches</h2>
      <p class="muted">Each saved search gets its own dashboard of the best fares found.</p>
    </section>
  </main>
</div>

<script>
(() => {
  const $ = (s, el = document) => el.querySelector(s);
  const h = (tag, attrs = {}, ...kids) => {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v; else if (k === 'text') el.textContent = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v); else el.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    return el;
  };
  const NS = 'http://www.w3.org/2000/svg';
  const sv = (tag, attrs, parent) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; };
  const gbp = (n) => '£' + Math.round(n).toLocaleString('en-GB');
  const dt = (s) => new Date(s + 'T00:00:00Z');
  const day = (s) => s ? dt(s).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' }) : '—';
  const short = (s) => s ? dt(s).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', timeZone: 'UTC' }) : '';
  const daysBetween = (a, b) => Math.round((dt(b) - dt(a)) / 864e5);
  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const slug = (s) => (s || 'search').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'search';

  // A read-only copy (the password-protected GitHub page) sets window.LOZ_DATA = {searches, checks} instead of using the live store.
  const STATIC = window.LOZ_DATA || null;

  // ---------- GitHub saving (the password-protected site only) ----------
  // Changes made on the site are encrypted with the page password and saved to the
  // repository as pending.enc.json; the twice-weekly check applies them to Loz Flights.
  const REPO = 'charlottefarrell87-code/loz-flights', PENDING = 'pending.enc.json';
  const ls = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }, del(k) { try { localStorage.removeItem(k); } catch (e) {} } };
  const toB64 = (u8) => { let s = ''; for (let i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]); return btoa(s); };
  const fromB64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  let aesKey = null;
  async function pageKey() {
    if (aesKey) return aesKey;
    let raw = null; try { raw = sessionStorage.getItem('loz-k'); } catch (e) {}
    if (!raw) return null;
    aesKey = await crypto.subtle.importKey('raw', fromB64(raw), 'AES-GCM', false, ['encrypt', 'decrypt']);
    return aesKey;
  }
  async function encrypt(obj) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await pageKey(), new TextEncoder().encode(JSON.stringify(obj))));
    return { v: 1, iv: toB64(iv), ct: toB64(ct) };
  }
  async function decrypt(doc) {
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(doc.iv) }, await pageKey(), fromB64(doc.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }
  const SHARED = 'shared-token.enc.json';
  let sharedToken = null, sharedMeta = null;
  const ghToken = () => ls.get('loz-gh-token') || sharedToken;
  async function loadSharedToken() {
    // Public repo: the encrypted file is readable without signing in; only the page password opens it.
    let doc = null;
    try {
      const r = await fetch(`https://api.github.com/repos/${REPO}/contents/${SHARED}?ref=main`, { headers: { Accept: 'application/vnd.github+json' }, cache: 'no-store' });
      if (r.ok) { const j = await r.json(); doc = JSON.parse(atob(j.content.replace(/\s/g, ''))); sharedMeta = { sha: j.sha }; }
      else if (r.status !== 404) {
        const r2 = await fetch(SHARED + '?t=' + Date.now(), { cache: 'no-store' });
        if (r2.ok) doc = await r2.json();
      }
    } catch (e) {}
    if (!doc || !doc.ct) { sharedToken = null; return; }
    try { const d = await decrypt(doc); sharedToken = d.token || null; sharedMeta = { ...(sharedMeta || {}), at: d.at }; } catch (e) { sharedToken = null; }
  }
  async function shareToken(tok) {
    const r0 = await fetch(`https://api.github.com/repos/${REPO}/contents/${SHARED}?ref=main`, { headers: { Authorization: 'Bearer ' + tok, Accept: 'application/vnd.github+json' }, cache: 'no-store' });
    const sha = r0.ok ? (await r0.json()).sha : null;
    const body = { message: 'Share editing with everyone who has the page password', content: btoa(JSON.stringify(await encrypt({ token: tok, at: new Date().toISOString() }))), branch: 'main' };
    if (sha) body.sha = sha;
    const r = await fetch(`https://api.github.com/repos/${REPO}/contents/${SHARED}`, { method: 'PUT', headers: { Authorization: 'Bearer ' + tok, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (!r.ok) throw ghErr(r.status);
    sharedToken = tok;
  }
  async function unshareToken() {
    const r0 = await fetch(`https://api.github.com/repos/${REPO}/contents/${SHARED}?ref=main`, { headers: ghHeaders(), cache: 'no-store' });
    if (r0.status === 404) { sharedToken = null; return; }
    if (!r0.ok) throw ghErr(r0.status);
    const r = await fetch(`https://api.github.com/repos/${REPO}/contents/${SHARED}`, { method: 'DELETE', headers: { ...ghHeaders(), 'Content-Type': 'application/json' }, body: JSON.stringify({ message: 'Stop sharing editing', sha: (await r0.json()).sha, branch: 'main' }) });
    if (!r.ok) throw ghErr(r.status);
    sharedToken = null;
  }
  const ghHeaders = () => ({ Authorization: 'Bearer ' + ghToken(), Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' });
  const ghErr = (status) => { const e = new Error('github ' + status); e.status = status; return e; };
  async function ghGetPending() {
    const r = await fetch(`https://api.github.com/repos/${REPO}/contents/${PENDING}?ref=main`, { headers: ghHeaders(), cache: 'no-store' });
    if (r.status === 404) return { sha: null, changes: [] };
    if (!r.ok) throw ghErr(r.status);
    const j = await r.json();
    const doc = JSON.parse(atob(j.content.replace(/\s/g, '')));
    return { sha: j.sha, changes: doc.ct ? (await decrypt(doc)).changes || [] : [] };
  }
  async function ghPutPending(changes, sha, message) {
    const body = { message, content: btoa(JSON.stringify(await encrypt({ changes }))), branch: 'main' };
    if (sha) body.sha = sha;
    const r = await fetch(`https://api.github.com/repos/${REPO}/contents/${PENDING}`, { method: 'PUT', headers: { ...ghHeaders(), 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (!r.ok) throw ghErr(r.status);
  }
  async function queueChange(change) {
    for (let attempt = 0; attempt < 2; attempt++) {
      const cur = await ghGetPending();
      const changes = cur.changes.filter((c) => c.id !== change.id).concat([change]);
      try {
        await ghPutPending(changes, cur.sha, `${change.op === 'delete' ? 'Delete' : 'Save'} search: ${change.name || change.id}`);
        state.pending = changes; applyPending(); return;
      } catch (e) { if (e.status === 409 && attempt === 0) continue; throw e; }
    }
  }
  function applyPending() {
    const map = new Map(STATIC.searches.filter((x) => x.data).map((x) => [x.id, { id: x.id, data: x.data }]));
    for (const c of state.pending || []) {
      if (c.op === 'delete') map.delete(c.id);
      else if (c.op === 'upsert' && c.data) map.set(c.id, { id: c.id, data: c.data, pending: true });
    }
    state.searches = [...map.values()].sort((a, b) => ((a.data.depart_from || '') < (b.data.depart_from || '') ? -1 : 1));
  }
  const ghMessage = (e) => e && e.status === 401 ? 'GitHub didn’t accept your token. Reconnect GitHub with a new one.'
    : e && (e.status === 403 || e.status === 404) ? 'Your GitHub token can’t save to loz-flights. Check it has Contents: Read and write for that repository.'
    : 'Couldn’t reach GitHub just now. Check your connection and try again.';

  function openConnect() {
    state.mode = 'connect';
    const main = $('#main'); main.replaceChildren();
    const err = h('p', { class: 'err', role: 'alert' });
    const input = h('input', { type: 'password', id: 'gh-token', autocomplete: 'off', placeholder: 'github_pat_…' });
    const form = h('form', { class: 'card editor' },
      h('h2', { text: 'Connect GitHub to edit' }),
      h('p', { class: 'muted', text: 'Saving searches here writes them, encrypted with the page password, to the loz-flights repository. GitHub needs a token for that. You only do this once on each device.' }),
      h('ol', { class: 'small', style: 'margin:0;padding-left:18px;display:grid;gap:6px' },
        h('li', {}, 'Open ', h('a', { href: 'https://github.com/settings/personal-access-tokens/new', target: '_blank', rel: 'noopener noreferrer', text: 'GitHub’s new fine-grained token page' }), ' (signed in to the account that can edit loz-flights).'),
        h('li', { text: 'Name it “Loz Flights”, set an expiry, and under Repository access choose Only select repositories, then loz-flights.' }),
        h('li', { text: 'Under Permissions, set Contents to Read and write. Leave everything else as it is.' }),
        h('li', { text: 'Generate the token, copy it and paste it below.' })),
      h('label', { class: 'f' }, 'Token', h('span', { class: 'hint', text: 'Kept in this browser. Disconnect any time.' }), input),
      h('div', { class: 'checks' }, h('label', {}, h('input', { type: 'checkbox', id: 'gh-share', checked: true }), 'Share editing with everyone who has the page password')),
      h('p', { class: 'muted small', text: 'Sharing saves the token in the repository, encrypted with the page password, so anyone who can unlock this site can add, edit and delete searches without a GitHub account. It only works on loz-flights. To stop, remove shared access below, or delete the token on GitHub.' }),
      sharedToken ? h('div', { class: 'confirm' }, h('span', { text: 'Editing is currently shared with everyone who has the password.' }),
        h('button', { class: 'btn danger', type: 'button', id: 'ghUnshare', text: 'Remove shared access', onclick: async (ev) => {
          const b = ev.currentTarget; b.disabled = true; b.textContent = 'Removing…';
          try { await unshareToken(); state.canEdit = !!ls.get('loz-gh-token'); state.mode = 'view'; render(); alertLine('Shared editing removed. Also delete the token on GitHub to be sure it can’t be used.'); }
          catch (x) { err.textContent = ghMessage(x); b.disabled = false; b.textContent = 'Remove shared access'; }
        } })) : null,
      err,
      h('div', { class: 'formbar' }, h('span'),
        h('div', { class: 'actions' },
          h('button', { class: 'btn', type: 'button', text: 'Cancel', onclick: () => { state.mode = 'view'; render(); } }),
          h('button', { class: 'btn primary', type: 'submit', id: 'ghSave', text: 'Connect' }))));
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const tok = input.value.trim(); if (!tok) { err.textContent = 'Paste your token first.'; return; }
      const b = $('#ghSave', form); b.disabled = true; b.textContent = 'Checking…';
      try {
        const r = await fetch(`https://api.github.com/repos/${REPO}`, { headers: { Authorization: 'Bearer ' + tok, Accept: 'application/vnd.github+json' }, cache: 'no-store' });
        if (!r.ok) throw ghErr(r.status);
        const j = await r.json();
        if (!j.permissions || !j.permissions.push) throw ghErr(403);
        const share = $('#gh-share', form).checked;
        if (share) { b.textContent = 'Sharing…'; await shareToken(tok); }
        else if (!ls.set('loz-gh-token', tok)) { err.textContent = 'This browser won’t store the token (private browsing or blocked site data).'; b.disabled = false; b.textContent = 'Connect'; return; }
        state.canEdit = !!(await pageKey());
        try { state.pending = (await ghGetPending()).changes; applyPending(); } catch (x) {}
        state.mode = 'view'; render();
      } catch (x) { err.textContent = ghMessage(x); b.disabled = false; b.textContent = 'Connect'; }
    });
    main.append(form); input.focus();
  }
  const state = { lastRequest: null, pending: [], db: null, canEdit: false, searches: [], current: null, checks: [], unsubChecks: null, mode: 'view', editing: null, confirmDelete: false };

  // ---------- rendering ----------
  function renderBoard() {
    const board = $('#board'); board.replaceChildren();
    for (const s of state.searches) {
      const c = s.data;
      board.append(h('button', { class: 'tab', type: 'button', 'aria-current': String(s.id === state.current && state.mode !== 'new'), onclick: () => select(s.id) },
        h('span', { class: 'route', text: `${(c.origins || []).length > 2 ? 'EUROPE' : (c.origins || []).join('/')} → ${c.dest || ''}${c.home_from && c.home_from !== c.dest ? ' · ' + c.home_from + ' → home' : ''}` }),
        h('span', { class: 'nm', text: c.name || 'Untitled search' }),
        h('span', { class: 'st', text: `${short(c.depart_from)} to ${short(c.return_to || c.return_from)}${c.status === 'paused' ? ' · paused' : ''}` })));
    }
  }

  function criteriaChips(c) {
    const chip = (label, val) => val ? h('span', { class: 'chip' }, label + ' ', h('b', { text: val })) : null;
    return h('div', { class: 'chips' },

  let mcpNs = null;
  const recentRequest = () => state.lastRequest && Date.now() - Date.parse(state.lastRequest.at) < CHECK_COOLDOWN ? state.lastRequest : null;
  const timeOf = (iso) => new Date(iso).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  async function requestCheck(search) {
    const btns = [...document.querySelectorAll('[data-check]')];
    btns.forEach((b) => { b.disabled = true; b.textContent = 'Starting…'; });
    const text = search
      ? `Manual check requested from Loz Flights for one search only: "${search.data.name}" (id ${search.id}). Do step 0, then steps 1 to 6 for that search only (update the Melbourne dashboard only if it is australian-open-2027), still rebuild the GitHub copy with every search, and keep the summary short.`
      : 'Manual check requested from Loz Flights: run every step now as normal.';
    try {
      await mcpNs.callTool('Claude Code Remote', 'fire_trigger', { trigger_id: TRIGGER, text }, { cache: false });
      const at = new Date().toISOString();
      state.lastRequest = { at, search: search ? search.id : null, name: search ? search.data.name : 'all searches' };
      try { await state.db.doc('meta/manual-check').set(state.lastRequest); } catch (e) {}
      alertLine(`Price check started for ${search ? '“' + search.data.name + '”' : 'all searches'}. New prices usually appear here within an hour, and you’ll get a notification.`);
    } catch (e) {
      const code = e && e.code;
      const msg = code === 'server_not_connected' || code === 'selection_required' ? 'Claude Code Remote isn’t connected for you. Add it in claude.ai Settings, Connectors, then try again.'
        : code === 'needs_reauth' ? 'Reconnect Claude Code Remote in claude.ai Settings, Connectors, then try again.'
        : code === 'not_in_manifest' ? 'This page isn’t allowed to start checks for you. Allow Claude Code Remote in the page’s permissions to use this button.'
        : code === 'blocked_by_policy' || code === 'approval_required' ? 'Your organisation’s settings don’t allow starting checks from this page.'
        : code === 'tool_error' ? 'Claude couldn’t start the check: ' + (e.message || 'the scheduled task refused it') + '.'
        : 'Couldn’t confirm the check started. Look for a new run of “Loz Flights fare check” in your scheduled tasks before trying again.';
      alertLine(msg);
    }
    renderCheckButtons();
  }
  function renderCheckButtons() {
    const recent = recentRequest();
    for (const b of document.querySelectorAll('[data-check]')) {
      b.disabled = !!recent;
      b.textContent = recent ? `Check started ${timeOf(recent.at)}` : b.dataset.check === 'all' ? 'Check prices now' : 'Check this search now';
      b.title = recent ? 'A check was started in the last 30 minutes. New prices appear when it finishes.' : '';
    }
  }

  // ---------- data flow ----------
  function select(id) {
    state.mode = 'view'; state.confirmDelete = false;
    if (location.hash.slice(1) !== id) location.hash = id; else { state.current = id; watchChecks(); render(); }
  }
  function watchChecks() {
    if (state.unsubChecks) { state.unsubChecks(); state.unsubChecks = null; }
    state.checks = [];
    if (STATIC && state.current) { state.checks = (STATIC.checks[state.current] || []).slice().sort((a, b) => (a.checked < b.checked ? -1 : 1)); return; }
    if (!state.current || !state.db) return;
    const id = state.current;
    state.unsubChecks = state.db.collection(`results/${id}/checks`).onSnapshot((snap) => {
      if (state.current !== id) return;
      state.checks = snap.docs.map((d) => d.data()).filter(Boolean).sort((a, b) => (a.checked < b.checked ? -1 : 1));
      if (state.mode === 'view') render();
    }, () => {});
  }
  function render() {
    $('#newBtn').hidden = !state.canEdit;
    const gb = $('#ghBtn');
    gb.hidden = !STATIC;
    gb.textContent = ls.get('loz-gh-token') ? 'Disconnect GitHub' : sharedToken ? 'Shared editing on' : 'Connect GitHub to edit';
    const cb = $('#checkAllBtn');
    cb.hidden = !(state.canEdit && !STATIC && mcpNs);
    cb.dataset.check = 'all';
    renderBoard();
    if (state.mode === 'view') renderView();
    renderCheckButtons();
  }
  function fromHash() {
    let want = decodeURIComponent(location.hash.slice(1));
    const ids = state.searches.map((s) => s.id);
    // Links from other dashboards: #new, #edit-<id>, #delete-<id>
    if (want === 'new' && state.canEdit) { history.replaceState(null, '', location.pathname + location.search); openEditor(null); return; }
    const m = want.match(/^(edit|delete)-(.+)$/);
    if (m && ids.includes(m[2])) {
      want = m[2];
      history.replaceState(null, '', '#' + want);
      if (state.current !== want) { state.current = want; watchChecks(); }
      if (m[1] === 'edit' && state.canEdit) { openEditor(state.searches.find((s) => s.id === want)); return; }
      if (m[1] === 'delete' && state.canEdit) { state.mode = 'view'; state.confirmDelete = true; render(); return; }
    }
    const next = ids.includes(want) ? want : ids.includes(state.current) ? state.current : ids[0] || null;
    const changed = next !== state.current;
    state.current = next;
    if (changed) watchChecks();
    if (state.mode === 'view') render(); else renderBoard();
  }

  $('#newBtn').addEventListener('click', () => openEditor(null));
  $('#checkAllBtn').addEventListener('click', () => requestCheck(null));
  $('#ghBtn').addEventListener('click', () => {
    if (ls.get('loz-gh-token')) { ls.del('loz-gh-token'); state.canEdit = !!sharedToken; state.mode = 'view'; render(); }
    else openConnect();
  });
  addEventListener('hashchange', () => { state.mode = 'view'; state.confirmDelete = false; fromHash(); });
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (state.mode === 'view') renderView(); }, 200); });

  (async () => {
    if (STATIC) {
      applyPending();
      fromHash();
      const key = await pageKey().catch(() => null);
      if (!key) return;
      await loadSharedToken();
      try {
        if (ghToken()) { state.pending = (await ghGetPending()).changes; state.canEdit = true; }
        else {
          const r = await fetch(PENDING + '?t=' + Date.now(), { cache: 'no-store' });
          if (r.ok) { const doc = await r.json(); state.pending = doc.ct ? (await decrypt(doc)).changes || [] : []; }
        }
      } catch (e) { if (ghToken()) state.canEdit = true; }
      applyPending();
      fromHash();
      return;
    }
    const [db, user] = await Promise.all([window.claude?.use?.('db') ?? null, window.claude?.use?.('user') ?? null]);
    if (!db) {
      $('#main').replaceChildren(h('section', { class: 'card empty' }, h('h2', { text: 'Sign in to see the searches' }), h('p', { class: 'muted', text: 'Saved searches and prices are stored with this page and need a signed-in Claude account to view.' })));
      return;
    }
    state.db = db;
    state.canEdit = user ? ((await user.canEdit()) || (await user.isOwner())) : false;
    if (state.canEdit) {
      window.claude.use('mcp').then((m) => { mcpNs = m; render(); }).catch(() => {});
      db.doc('meta/manual-check').onSnapshot((snap) => { state.lastRequest = snap.exists ? snap.data() : null; renderCheckButtons(); }, () => {});
    }
    db.collection('searches').onSnapshot((snap) => {
      state.searches = snap.docs.filter((d) => d.exists).map((d) => ({ id: d.id, data: d.data() }))
        .sort((a, b) => ((a.data.depart_from || '') < (b.data.depart_from || '') ? -1 : 1));
      fromHash();
    }, () => { $('#main').replaceChildren(h('section', { class: 'card empty' }, h('h2', { text: 'Couldn’t load the searches' }), h('p', { class: 'muted', text: 'Reload the page to try again.' }))); });
  })();
})();
</script>
